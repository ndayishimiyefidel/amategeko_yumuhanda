name: rwanda_traffic_rules
description: Rwanda Traffic Rules Pro. A complete app for learning and passing the Rwanda Traffic Rules Pro Exam.
# publish_to: "none"
version: 1.0.2+8
#this offline version
environment:
  sdk: ">=2.18.2 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.7
  app_links: ^3.1.0
  flutter_local_notifications: ^17.0.0
  curved_navigation_bar: ^1.0.3
  fluttertoast: ^8.1.2
  http: ^0.13.0
  firebase_messaging: ^14.7.1
  cached_network_image: ^3.2.2
  url_launcher: ^6.3.0
  share_plus: any
  connectivity_plus: ^5.0.1
  shared_preferences: ^2.0.15
  random_string: ^2.0.1
  image_picker: ^1.0.4
  device_info_plus: ^9.0.1
  upgrader: ^8.0.0
  file_picker: ^10.2.0
  uuid: ^4.1.0
  flutter_phone_direct_caller: ^2.1.1
  just_audio: ^0.9.36
  screenshot_callback: ^3.0.1
  audio_video_progress_bar: ^2.0.1
  rxdart: ^0.27.7
  intl: ^0.20.2
  google_mobile_ads: ^4.0.0
  package_info_plus: ^4.1.0
  pdfx: ^2.6.0
  screen_protector: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  dart_code_metrics: ^5.5.1
  dependency_validator: ^3.2.2
  flutter_lints: ^3.0.0
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/files/
    - assets/examimages/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
    - family: Courgette
      fonts:
        - asset: assets/fonts/Courgette-Regular.ttf
